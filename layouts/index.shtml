<extend template="base.shtml">
<title id="title" :text="$page.title"></title>
<head id="head">
  <style>
    #page h2,
		#page h3 {
			text-align: left;
		}

		#page h2 {
			font-size: 1.7rem;
			border-bottom: 1px dashed #aaa;
			margin-top: 2em;
		}

		#page h3 {
			font-size: 1.5rem;
		}

		#page h4 {
			font-size: 1rem;
		}

		.title,
		.subtitle {
			margin-bottom: 0;
		}

		.subtitle,
		.tagline {
			margin-top: 0;
		}

		.title {
			font-size: 4rem;
			margin-top: 2rem;
		}

		.subtitle {
			font-size: 2rem;
		}

		.tagline {
			font-size: 1rem;
			font-style: italic;
			padding: 0.5rem 0 2rem 0;
			text-align: center;
		}

		.get-started a {
			color: black;
			font-weight: normal;
			background-color: #ccc;
			border: 1px solid #ccc;
			padding: 3px 10px;
			text-decoration: none;
		}

		.get-started a:hover {
			background-color: white;
		}
    #page {
	border: 2px solid black;
	border-radius: 1rem;
	padding: 1rem;
	background: rgb(255, 253, 245);
    }
  </style>
</head>
<div id="content">
  <h1 class="centered title">Loftafi</h1>
  <p class="centered tagline">Random coding related thoughts</p>
  <div id="page" :html="$page.content()"></div>
</div>
